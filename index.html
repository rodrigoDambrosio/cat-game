<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tamagochis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  .menu {
    width: 380px;
    max-width: 100%;
    text-align: center;
  }
  .subtitle { margin-bottom: 24px; }
  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .card {
    display: block;
    text-decoration: none;
    color: var(--text);
    background: var(--shell);
    border: 3px solid var(--shell-border);
    box-shadow: 0 0 0 4px var(--screen), 0 10px 0 rgba(0, 0, 0, 0.4);
    padding: 24px 12px 20px;
    transition: transform 0.1s ease, border-color 0.15s ease;
  }
  .card:hover { border-color: var(--accent); }
  .card:active { transform: translateY(3px); box-shadow: 0 0 0 4px var(--screen), 0 6px 0 rgba(0, 0, 0, 0.4); }
  .card-art {
    font-size: 2.6rem;
    line-height: 1;
    margin-bottom: 14px;
  }
  .card-name {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.7rem;
    color: var(--accent);
  }
  .card-cat { --accent: var(--cat); }
  .card-fish { --accent: var(--fish); }
  .foot {
    margin-top: 26px;
    font-size: 0.7rem;
    color: var(--text-dim);
  }
</style>
</head>
<body>
  <div class="menu">
    <h1>TAMAGOCHIS</h1>
    <div class="subtitle">Elegí a quién cuidar</div>

    <div class="cards">
      <a class="card card-cat" href="cat.html">
        <div class="card-art">🐱</div>
        <div class="card-name">NERMAL</div>
      </a>

      <a class="card card-fish" href="fish.html">
        <div class="card-art">🐠</div>
        <div class="card-name">NEMO</div>
      </a>
    </div>

    <div class="foot">El progreso de cada uno se guarda por separado</div>
  </div>
</body>
</html>
